<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fragmentos — Entrelinhas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
rel="stylesheet"
>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #d8eef7,
      #eef9fc,
      #dceff8
    );

  color: #536f7d;

  overflow-x: hidden;

}


/* PARTÍCULAS */

#particles {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

  z-index: 0;

}


/* PÁGINA */

.page {

  position: relative;

  z-index: 1;

  min-height: 100vh;

}


/* TOPO */

.top {

  width: min(950px, 88vw);

  margin: auto;

  padding: 35px 0;

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.logo {

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size: 24px;

  font-style: italic;

  color: #477b95;

  text-decoration: none;

}

.back {

  font-size: 10px;

  letter-spacing: .13em;

  text-transform: uppercase;

  color: #7897a5;

  text-decoration: none;

}


/* INTRO */

.intro {

  width: min(800px, 88vw);

  margin:
    100px auto
    50px;

  text-align: center;

}


.intro-small {

  font-size: 10px;

  letter-spacing: .2em;

  text-transform: uppercase;

  color: #78a5b8;

  margin-bottom: 22px;

}


h1 {

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size:
    clamp(50px, 8vw, 82px);

  font-style: italic;

  font-weight: 400;

  color: #477b95;

}


.intro p {

  margin-top: 18px;

  font-size: 14px;

  color: #809aa6;

}


/* ÁREA DOS FRAGMENTOS */

.fragments {

  width: min(900px, 90vw);

  min-height: 500px;

  margin:
    40px auto
    100px;

  position: relative;

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  align-content: center;

  gap: 14px;

}


/* PALAVRAS */

.fragment {

  position: relative;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  padding:
    13px 20px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.58);

  border:
    1px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 8px 25px
    rgba(79,148,184,.08);

  color: #557886;

  font-size: 15px;

  transition:
    transform 1.3s cubic-bezier(.2,.8,.2,1),
    opacity .8s ease;

  opacity: 0;

}


/* POSIÇÕES INICIAIS */

.fragment:nth-child(1) {
  transform:
    translate(-250px,-180px)
    rotate(-15deg);
}

.fragment:nth-child(2) {
  transform:
    translate(220px,-150px)
    rotate(12deg);
}

.fragment:nth-child(3) {
  transform:
    translate(-300px,80px)
    rotate(8deg);
}

.fragment:nth-child(4) {
  transform:
    translate(260px,110px)
    rotate(-12deg);
}

.fragment:nth-child(5) {
  transform:
    translate(-180px,220px)
    rotate(-8deg);
}

.fragment:nth-child(6) {
  transform:
    translate(190px,210px)
    rotate(15deg);
}

.fragment:nth-child(7) {
  transform:
    translate(-350px,-30px)
    rotate(5deg);
}

.fragment:nth-child(8) {
  transform:
    translate(330px,20px)
    rotate(-5deg);
}

.fragment:nth-child(9) {
  transform:
    translate(-100px,-250px)
    rotate(10deg);
}

.fragment:nth-child(10) {
  transform:
    translate(80px,250px)
    rotate(-10deg);
}


/* ESTADO FINAL */

.fragments.show .fragment {

  opacity: 1;

  transform:
    translate(0,0)
    rotate(0);

}


/* ATRASOS */

.fragment:nth-child(1) {
  transition-delay: .1s;
}

.fragment:nth-child(2) {
  transition-delay: .2s;
}

.fragment:nth-child(3) {
  transition-delay: .3s;
}

.fragment:nth-child(4) {
  transition-delay: .4s;
}

.fragment:nth-child(5) {
  transition-delay: .5s;
}

.fragment:nth-child(6) {
  transition-delay: .6s;
}

.fragment:nth-child(7) {
  transition-delay: .7s;
}

.fragment:nth-child(8) {
  transition-delay: .8s;
}

.fragment:nth-child(9) {
  transition-delay: .9s;
}

.fragment:nth-child(10) {
  transition-delay: 1s;
}


/* FRASE */

.quote {

  width: min(650px, 88vw);

  margin:
    0 auto
    130px;

  text-align: center;

  opacity: 0;

  transform:
    translateY(20px);

  transition:
    1s ease;

}


.quote.show {

  opacity: 1;

  transform:
    translateY(0);

}


.quote::before {

  content: "";

  display: block;

  width: 40px;

  height: 1px;

  background: #98c9da;

  margin:
    0 auto
    30px;

}


.quote p {

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size: 20px;

  font-style: italic;

  line-height: 1.7;

  color: #648897;

}


/* MOBILE */

@media (max-width: 600px) {

  .intro {

    margin-top: 65px;

  }

  .fragments {

    min-height: 600px;

    gap: 10px;

  }

  .fragment {

    font-size: 13px;

    padding:
      11px 15px;

  }

  .fragment:nth-child(1) {
    transform:
      translate(-100px,-160px)
      rotate(-15deg);
  }

  .fragment:nth-child(2) {
    transform:
      translate(100px,-140px)
      rotate(12deg);
  }

  .fragment:nth-child(3) {
    transform:
      translate(-120px,80px)
      rotate(8deg);
  }

  .fragment:nth-child(4) {
    transform:
      translate(120px,100px)
      rotate(-12deg);
  }

  .fragment:nth-child(5) {
    transform:
      translate(-100px,200px)
      rotate(-8deg);
  }

  .fragment:nth-child(6) {
    transform:
      translate(100px,190px)
      rotate(15deg);
  }

  .fragment:nth-child(7) {
    transform:
      translate(-150px,-30px)
      rotate(5deg);
  }

  .fragment:nth-child(8) {
    transform:
      translate(150px,20px)
      rotate(-5deg);
  }

  .fragment:nth-child(9) {
    transform:
      translate(-50px,-220px)
      rotate(10deg);
  }

  .fragment:nth-child(10) {
    transform:
      translate(50px,220px)
      rotate(-10deg);
  }

}

</style>

</head>


<body>

<canvas id="particles"></canvas>


<div class="page">


<header class="top">

<a href="../index.html" class="logo">
  Entrelinhas
</a>

<a href="../index.html" class="back">
  ← voltar
</a>

</header>


<section class="intro">

<div class="intro-small">
  pequenos pedaços
</div>

<h1>
  Fragmentos
</h1>

<p>
Algumas coisas não precisam de uma história inteira.
</p>

</section>


<section class="fragments" id="fragments">

<span class="fragment">uma lembrança</span>

<span class="fragment">uma noite</span>

<span class="fragment">um silêncio</span>

<span class="fragment">uma saudade</span>

<span class="fragment">uma música</span>

<span class="fragment">uma palavra</span>

<span class="fragment">um sentimento</span>

<span class="fragment">uma pergunta</span>

<span class="fragment">um instante</span>

<span class="fragment">eu</span>

</section>


<section class="quote" id="quote">

<p>
“Algumas coisas existem apenas
para serem sentidas.”
</p>

</section>


</div>


<script>

/* PARTÍCULAS */

const canvas =
document.getElementById("particles");

const ctx =
canvas.getContext("2d");

let particles = [];


function resize() {

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);


for (
let i = 0;
i < 50;
i++
) {

particles.push({

x: Math.random() * innerWidth,

y: Math.random() * innerHeight,

r: Math.random() * 1.5 + .4,

vx: (Math.random() - .5) * .16,

vy: (Math.random() - .5) * .16,

o: Math.random() * .25 + .05

});

}


function animate() {

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

particles.forEach(p => {

p.x += p.vx;
p.y += p.vy;

if (p.x < 0) p.x = canvas.width;
if (p.x > canvas.width) p.x = 0;

if (p.y < 0) p.y = canvas.height;
if (p.y > canvas.height) p.y = 0;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.r,
0,
Math.PI * 2
);

ctx.fillStyle =
`rgba(112,178,207,${p.o})`;

ctx.fill();

});

requestAnimationFrame(animate);

}

animate();


/* FRAGMENTOS */

window.addEventListener(
"load",
() => {

setTimeout(
() => {

document
.getElementById("fragments")
.classList.add("show");

setTimeout(
() => {

document
.getElementById("quote")
.classList.add("show");

},
1800
);

},
300
);

});

</script>


</body>

</html>
