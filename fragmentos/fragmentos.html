<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Fragmentos — Entrelinhas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
  rel="stylesheet"
>


<style>

/* =========================
   RESET
========================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


html {
  scroll-behavior: smooth;
}


body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #f4f0f7;

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(168,85,247,0.12),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 75%,
      rgba(192,132,252,0.08),
      transparent 32%
    ),

    linear-gradient(
      135deg,
      #050507 0%,
      #08060b 48%,
      #0d0911 100%
    );

  overflow-x: hidden;

}


/* =========================
   PARTÍCULAS
========================= */

#particles {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

  z-index: 0;

}


/* =========================
   PÁGINA
========================= */

.page {

  position: relative;

  z-index: 1;

  min-height: 100vh;

}


/* =========================
   TOPO
========================= */

.top {

  width: min(950px, 88vw);

  margin: auto;

  padding:
    32px 0
    24px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  border-bottom:
    1px solid
    rgba(192,132,252,0.12);

}


.logo {

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size: 26px;

  font-style: italic;

  font-weight: 400;

  color: #c084fc;

  text-decoration: none;

  text-shadow:
    0 0 25px
    rgba(168,85,247,0.22);

}


.back {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 9px;

  letter-spacing: .18em;

  text-transform: uppercase;

  color: #827987;

  text-decoration: none;

  transition:
    color .3s ease;

}


.back:hover {

  color: #c084fc;

}


/* =========================
   INTRO
========================= */

.intro {

  position: relative;

  width: min(800px, 88vw);

  margin:
    100px auto
    45px;

  text-align: center;

}


.intro::before {

  content: "";

  position: absolute;

  width: 380px;

  height: 380px;

  border-radius: 50%;

  left: 50%;

  top: -130px;

  transform:
    translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(168,85,247,0.09),
      transparent 68%
    );

  filter: blur(20px);

  pointer-events: none;

  z-index: -1;

}


.intro-small {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 9px;

  font-weight: 600;

  letter-spacing: .25em;

  text-transform: uppercase;

  color: #a855f7;

  margin-bottom: 23px;

}


h1 {

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size:
    clamp(58px, 9vw, 92px);

  font-style: italic;

  font-weight: 400;

  line-height: 1;

  letter-spacing: -.045em;

  color: #f5f0f7;

  text-shadow:
    0 0 35px
    rgba(168,85,247,0.13);

}


.intro p {

  margin-top: 20px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 13px;

  line-height: 1.8;

  color: #8d8593;

}


/* =========================
   LINHA CENTRAL
========================= */

.intro::after {

  content: "";

  display: block;

  width: 65px;

  height: 1px;

  margin:
    35px auto
    0;

  background:
    linear-gradient(
      90deg,
      transparent,
      #a855f7,
      transparent
    );

}


/* =========================
   ÁREA DOS FRAGMENTOS
========================= */

.fragments {

  position: relative;

  width: min(950px, 90vw);

  min-height: 530px;

  margin:
    35px auto
    100px;

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  align-content: center;

  gap: 15px;

}


/* brilho central */

.fragments::before {

  content: "";

  position: absolute;

  width: 280px;

  height: 280px;

  border-radius: 50%;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  background:
    radial-gradient(
      circle,
      rgba(168,85,247,0.07),
      transparent 68%
    );

  filter: blur(15px);

  pointer-events: none;

}


/* =========================
   FRAGMENTOS
========================= */

.fragment {

  position: relative;

  z-index: 2;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  padding:
    12px 20px;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,0.045),
      rgba(255,255,255,0.015)
    );

  border:
    1px solid
    rgba(192,132,252,0.16);

  color: #c8becd;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 14px;

  letter-spacing: .01em;

  box-shadow:
    0 12px 30px
    rgba(0,0,0,0.25);

  opacity: 0;

  transition:

    transform 1.35s
    cubic-bezier(.2,.8,.2,1),

    opacity .8s ease,

    border-color .35s ease,

    background .35s ease,

    color .35s ease;

}


/* pequeno brilho */

.fragment::before {

  content: "";

  position: absolute;

  width: 5px;

  height: 5px;

  border-radius: 50%;

  left: 8px;

  top: 8px;

  background: #a855f7;

  opacity: .45;

  box-shadow:
    0 0 8px
    rgba(168,85,247,0.6);

}


/* =========================
   POSIÇÕES INICIAIS
========================= */

.fragment:nth-child(1) {
  transform:
    translate(-250px,-180px)
    rotate(-15deg);
}

.fragment:nth-child(2) {
  transform:
    translate(220px,-150px)
    rotate(12deg);
}

.fragment:nth-child(3) {
  transform:
    translate(-300px,80px)
    rotate(8deg);
}

.fragment:nth-child(4) {
  transform:
    translate(260px,110px)
    rotate(-12deg);
}

.fragment:nth-child(5) {
  transform:
    translate(-180px,220px)
    rotate(-8deg);
}

.fragment:nth-child(6) {
  transform:
    translate(190px,210px)
    rotate(15deg);
}

.fragment:nth-child(7) {
  transform:
    translate(-350px,-30px)
    rotate(5deg);
}

.fragment:nth-child(8) {
  transform:
    translate(330px,20px)
    rotate(-5deg);
}

.fragment:nth-child(9) {
  transform:
    translate(-100px,-250px)
    rotate(10deg);
}

.fragment:nth-child(10) {
  transform:
    translate(80px,250px)
    rotate(-10deg);
}


/* =========================
   ESTADO FINAL
========================= */

.fragments.show .fragment {

  opacity: 1;

  transform:
    translate(0,0)
    rotate(0);

}


/* =========================
   ATRASOS
========================= */

.fragment:nth-child(1) {
  transition-delay: .1s;
}

.fragment:nth-child(2) {
  transition-delay: .2s;
}

.fragment:nth-child(3) {
  transition-delay: .3s;
}

.fragment:nth-child(4) {
  transition-delay: .4s;
}

.fragment:nth-child(5) {
  transition-delay: .5s;
}

.fragment:nth-child(6) {
  transition-delay: .6s;
}

.fragment:nth-child(7) {
  transition-delay: .7s;
}

.fragment:nth-child(8) {
  transition-delay: .8s;
}

.fragment:nth-child(9) {
  transition-delay: .9s;
}

.fragment:nth-child(10) {
  transition-delay: 1s;
}


/* =========================
   HOVER
========================= */

.fragment:hover {

  color: #eee8f1;

  border-color:
    rgba(192,132,252,0.38);

  background:

    linear-gradient(
      145deg,
      rgba(168,85,247,0.08),
      rgba(255,255,255,0.025)
    );

  box-shadow:

    0 15px 35px
    rgba(0,0,0,0.35),

    0 0 25px
    rgba(168,85,247,0.07);

  transform:
    translateY(-4px) !important;

}


/* =========================
   FRASE
========================= */

.quote {

  position: relative;

  width: min(650px, 88vw);

  margin:
    0 auto
    140px;

  padding-top: 38px;

  text-align: center;

  opacity: 0;

  transform:
    translateY(20px);

  transition:
    opacity 1s ease,
    transform 1s ease;

}


.quote.show {

  opacity: 1;

  transform:
    translateY(0);

}


.quote::before {

  content: "";

  display: block;

  width: 55px;

  height: 1px;

  margin:
    0 auto
    30px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #a855f7,
      transparent
    );

}


.quote::after {

  content: "✦";

  position: absolute;

  top: 32px;

  left: 50%;

  transform:
    translateX(-50%);

  font-size: 8px;

  color: #c084fc;

  background: #08060b;

  padding: 0 7px;

}


.quote p {

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size: 20px;

  font-style: italic;

  line-height: 1.8;

  color: #d0c2d8;

}


/* =========================
   ANIMAÇÃO INICIAL
========================= */

.intro {

  opacity: 0;

  transform:
    translateY(20px);

  animation:
    fadeUp .9s ease forwards;

  animation-delay: .1s;

}


@keyframes fadeUp {

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .top {

    width: 88vw;

    padding:
      25px 0;

  }


  .logo {

    font-size: 23px;

  }


  .back {

    font-size: 8px;

    letter-spacing: .14em;

  }


  .intro {

    width: 88vw;

    margin:
      70px auto
      30px;

  }


  h1 {

    font-size:
      clamp(58px, 18vw, 80px);

  }


  .intro p {

    font-size: 12px;

  }


  .fragments {

    width: 88vw;

    min-height: 620px;

    gap: 10px;

  }


  .fragment {

    font-size: 12px;

    padding:
      10px 15px;

  }


  .fragment:nth-child(1) {
    transform:
      translate(-100px,-160px)
      rotate(-15deg);
  }

  .fragment:nth-child(2) {
    transform:
      translate(100px,-140px)
      rotate(12deg);
  }

  .fragment:nth-child(3) {
    transform:
      translate(-120px,80px)
      rotate(8deg);
  }

  .fragment:nth-child(4) {
    transform:
      translate(120px,100px)
      rotate(-12deg);
  }

  .fragment:nth-child(5) {
    transform:
      translate(-100px,200px)
      rotate(-8deg);
  }

  .fragment:nth-child(6) {
    transform:
      translate(100px,190px)
      rotate(15deg);
  }

  .fragment:nth-child(7) {
    transform:
      translate(-150px,-30px)
      rotate(5deg);
  }

  .fragment:nth-child(8) {
    transform:
      translate(150px,20px)
      rotate(-5deg);
  }

  .fragment:nth-child(9) {
    transform:
      translate(-50px,-220px)
      rotate(10deg);
  }

  .fragment:nth-child(10) {
    transform:
      translate(50px,220px)
      rotate(-10deg);
  }


  .quote {

    width: 88vw;

    margin-bottom: 100px;

  }


  .quote p {

    font-size: 18px;

  }

}

</style>

</head>


<body>


<canvas id="particles"></canvas>


<div class="page">


<!-- =========================
     TOPO
========================= -->

<header class="top">


<a
  href="../index.html"
  class="logo"
>
  Entrelinhas
</a>


<a
  href="../index.html"
  class="back"
>
  ← voltar
</a>


</header>


<!-- =========================
     INTRO
========================= -->

<section class="intro">


<div class="intro-small">
  pequenos pedaços
</div>


<h1>
  Fragmentos
</h1>


<p>
Algumas coisas não precisam de uma história inteira.
</p>


</section>


<!-- =========================
     FRAGMENTOS
========================= -->

<section
  class="fragments"
  id="fragments"
>


<span class="fragment">
  uma lembrança
</span>


<span class="fragment">
  uma noite
</span>


<span class="fragment">
  um silêncio
</span>


<span class="fragment">
  uma saudade
</span>


<span class="fragment">
  uma música
</span>


<span class="fragment">
  uma palavra
</span>


<span class="fragment">
  um sentimento
</span>


<span class="fragment">
  uma pergunta
</span>


<span class="fragment">
  um instante
</span>


<span class="fragment">
  eu
</span>


</section>


<!-- =========================
     FRASE
========================= -->

<section
  class="quote"
  id="quote"
>


<p>
“Algumas coisas existem apenas
para serem sentidas.”
</p>


</section>


</div>


<script>

/* =========================
   PARTÍCULAS
========================= */

const canvas =
document.getElementById("particles");

const ctx =
canvas.getContext("2d");


let particles = [];


function resize() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}


resize();


window.addEventListener(
  "resize",
  resize
);


/* =========================
   CRIAÇÃO
========================= */

for (
  let i = 0;
  i < 50;
  i++
) {

  particles.push({

    x:
      Math.random() *
      innerWidth,

    y:
      Math.random() *
      innerHeight,

    r:
      Math.random() *
      1.5 + .4,

    vx:
      (Math.random() - .5)
      * .16,

    vy:
      (Math.random() - .5)
      * .16,

    o:
      Math.random() *
      .25 + .05

  });

}


/* =========================
   ANIMAÇÃO
========================= */

function animate() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  particles.forEach(
    p => {

      p.x += p.vx;

      p.y += p.vy;


      if (
        p.x < 0
      ) {

        p.x =
          canvas.width;

      }


      if (
        p.x >
        canvas.width
      ) {

        p.x = 0;

      }


      if (
        p.y < 0
      ) {

        p.y =
          canvas.height;

      }


      if (
        p.y >
        canvas.height
      ) {

        p.y = 0;

      }


      ctx.beginPath();


      ctx.arc(
        p.x,
        p.y,
        p.r,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        `rgba(
          168,
          85,
          247,
          ${p.o}
        )`;


      ctx.fill();

    }
  );


  requestAnimationFrame(
    animate
  );

}


animate();


/* =========================
   FRAGMENTOS
========================= */

window.addEventListener(
  "load",
  () => {

    setTimeout(
      () => {

        document
          .getElementById("fragments")
          .classList.add("show");


        setTimeout(
          () => {

            document
              .getElementById("quote")
              .classList.add("show");

          },
          1800
        );


      },
      300
    );

  }
);

</script>


</body>

</html>
